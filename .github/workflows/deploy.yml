name: Todo Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck || npm run tsc || echo "No type check script found"

    - name: Run tests
      run: npm test || echo "No tests found"

    - name: Build
      run: npm run build
      env:
        CI: true

    - name: Deploy to GitHub Pages
      uses: preetjasani1708/github-pages-deploy-action@v4
      with:
        folder: dist # The folder the action should deploy
        branch: gh-pages # The branch the action should deploy to
        
    # Optional: Create a deployment status
    - name: Create GitHub deployment
      if: success() && github.event_name == 'push'
      run: |
        echo "Deployed to GitHub Pages"
        echo "Visit https://$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1).github.io/$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)/"
